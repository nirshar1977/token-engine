spring:
  application:
    name: token-engine-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tokens}
    username: ${DB_USER:tokens}
    password: ${DB_PASSWORD:tokens}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: usage
    default-schema: usage
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  shutdown: graceful

tokenengine:
  gateway:
    upstream:
      base-url: ${TOKENENGINE_UPSTREAM_URL:https://api.anthropic.com}
    auth:
      required: ${TOKENENGINE_REQUIRE_DEVELOPER_KEY:true}
      developer-keys: ${TOKENENGINE_DEVELOPER_KEYS:}
  security:
    admin-key: ${TOKENENGINE_ADMIN_KEY:}
  session:
    ttl: 2h
  analyser:
    min-block-bytes: 1024
  usage:
    stream-key: tokenengine:usage
    max-length: 100000
  # USD per million tokens, from https://platform.claude.com/docs/en/about-claude/pricing (October 2026).
  # Longest matching prefix wins. Cache writes: 1.25x (5 min) / 2x (1 hour) of input; reads per model below.
  pricing:
    models:
      - { model-prefix: claude-fable-5-1,  input: 10,   output: 50,  cache-read-multiplier: 0.025 }
      - { model-prefix: claude-mythos-5-1, input: 10,   output: 50,  cache-read-multiplier: 0.025 }
      - { model-prefix: claude-fable-5,    input: 10,   output: 50 }
      - { model-prefix: claude-mythos-5,   input: 10,   output: 50 }
      - { model-prefix: claude-opus-5-5,   input: 4,    output: 20,  cache-read-multiplier: 0.05 }
      - { model-prefix: claude-opus-5,     input: 5,    output: 25 }
      - { model-prefix: claude-opus-4-8,   input: 5,    output: 25 }
      - { model-prefix: claude-opus-4-7,   input: 5,    output: 25 }
      - { model-prefix: claude-opus-4-6,   input: 5,    output: 25 }
      - { model-prefix: claude-opus-4-5,   input: 5,    output: 25 }
      - { model-prefix: claude-opus-4-1,   input: 15,   output: 75 }
      - { model-prefix: claude-opus-4,     input: 15,   output: 75 }
      - { model-prefix: claude-sonnet-5-5, input: 2,    output: 10,  cache-read-multiplier: 0.05 }
      - { model-prefix: claude-sonnet-5,   input: 2,    output: 10 }
      - { model-prefix: claude-sonnet-4,   input: 3,    output: 15 }
      - { model-prefix: claude-haiku-5-5,  input: 0.10, output: 0.50,
          long-context-threshold: 100000, long-context-input: 0.50, long-context-output: 2.50 }
      - { model-prefix: claude-haiku-4-5,  input: 1,    output: 5 }
      - { model-prefix: claude-3-5-haiku,  input: 0.80, output: 4 }

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  paths-to-match: /engine/api/**
  swagger-ui:
    path: /swagger-ui.html
